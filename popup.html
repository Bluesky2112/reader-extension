<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 250px; padding: 12px; font-family: sans-serif; }
    label { display: block; margin-top: 12px; margin-bottom: 6px; font-size: 13px; font-weight: bold;}
    input[type="range"], select { width: 100%; box-sizing: border-box; }
    #val { font-weight: normal; color: #1a73e8; }
    
    /* Style cho công tắc */
    .switch-container { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
    .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 22px; }
    .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: #1a73e8; }
    input:checked + .slider:before { transform: translateX(18px); }
  </style>
</head>
<body>
  <div class="switch-container">
    <span style="font-weight: bold; font-size: 14px;">Bật Extension</span>
    <label class="switch">
      <input type="checkbox" id="enableToggle">
      <span class="slider"></span>
    </label>
  </div>

  <label>Chọn giọng đọc:</label>
  <select id="voiceSelect"></select>

  <label>Tốc độ đọc: <span id="val">1.0</span>x</label>
  <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1">
  
  <script src="popup.js"></script>
</body>
</html>
